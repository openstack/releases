- job:
    name: releases-tox-list-changes
    parent: openstack-tox
    post-run: playbooks/releases-tox-list-changes/post.yaml
    timeout: 3600
    vars:
      tox_envlist: list-changes
    irrelevant-files:
      - ^data/.*$
      - ^doc/.*$

- job:
    name: releases-tox-validate
    parent: openstack-tox-validate
    post-run: playbooks/releases-tox-validate/post.yaml
    timeout: 3600
    irrelevant-files:
      - ^doc/.*$

- project:
    templates:
      - build-openstack-docs-pti
    check:
      jobs:
        - releases-tox-validate
        - releases-tox-list-changes
        - openstack-tox-py310:
            irrelevant-files: &unit-irrelevant-files
              - ^data/.*$
              - ^deliverables/.*$
              - ^doc/.*$
        - openstack-tox-py311:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py312:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py313:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py314:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py315:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-pep8:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-bashate:
            files:
              - ^.*\.sh$
    release-approval:
      jobs:
        - check-release-approval
    gate:
      jobs:
        - releases-tox-validate:
            timeout: 10800
        - openstack-tox-py310:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py311:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py312:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py313:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py314:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-py315:
            irrelevant-files: *unit-irrelevant-files
        - openstack-tox-pep8:
            irrelevant-files: *unit-irrelevant-files
    post:
      jobs:
        - publish-openstack-python-branch-tarball
    release-post:
      jobs:
        - tag-releases
        - publish-tox-docs-releases:
            dependencies:
              - tag-releases
